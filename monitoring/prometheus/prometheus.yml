global:
  scrape_interval: 5s
  evaluation_interval: 5s

# LiveKit runs in LiveKit Cloud, which exposes no Prometheus scrape endpoint,
# so there is no SFU target here. Voice-quality metrics come from the agent's
# own instrumentation instead.
scrape_configs:
  - job_name: 'devops-tutor-backend'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'devops-tutor-agent'
    static_configs:
      - targets: ['agent:8001']
