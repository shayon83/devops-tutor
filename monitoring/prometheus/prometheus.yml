global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'devops-tutor-backend'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'devops-tutor-agent'
    static_configs:
      - targets: ['agent:8001']

  - job_name: 'livekit-sfu'
    static_configs:
      - targets: ['livekit:7880']
