apiVersion: 1

# Explicit uids: the dashboard JSON references these, so panels resolve their
# datasource instead of relying on a name-to-uid guess.
datasources:
  - name: Prometheus
    uid: devops-tutor-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: devops-tutor-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
