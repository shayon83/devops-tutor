server {
    listen 80;
    server_name localhost;

    # Container healthcheck target; avoids depending on the SPA bundle.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
